name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Render/CLI tests launch a real Chromium that the tool downloads into
      # ~/.screenshot-composer/chromium on first run. Install the OS libraries it needs.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Test
        run: npm test
